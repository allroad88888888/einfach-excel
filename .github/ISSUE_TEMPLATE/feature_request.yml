name: 功能建议
description: 提出一个可解决具体问题的功能建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先搜索已有 issue，避免重复提交。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 请说明使用场景、受影响的人，以及你希望达成的目标。
      placeholder: 当……时，我无法……，希望能够……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 请描述你期待的交互、API 或行为；不确定实现方式也没关系。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过哪些替代方案？
      description: 包括现有 API、变通办法或其他设计，以及它们为何不足。

  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 请区分首版必须包含的内容和明确不在首版处理的内容。
      value: |
        首版范围：
        -

        首版非目标：
        -
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充材料
      description: 可附上相关 issue、示例、原型、截图或参考链接。请不要提供敏感信息。
