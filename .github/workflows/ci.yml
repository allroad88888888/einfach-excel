name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Lingui 6 的开发工具要求 22.19+；对外包的 22.12 基线在构建后另验。
        node-version: ['22.19.0', 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # `npm run build` 的链条里有 ensureWasm,缺 excel/excel-wasm/lite 时会调
      # `build:wasm` 去跑 wasm-pack。本仓的 tsc/rollup 产物依赖 WASM 侧
      # 的类型与产物,所以 CI 必须具备 Rust 工具链 —— 否则 build 直接
      # exit 127 (wasm-pack: not found)。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 不缓存 target：三个独立 crate 的双配置测试产物曾填满 runner 磁盘。
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('excel/rust/**/Cargo.lock', 'excel/rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      - run: pnpm install --frozen-lockfile
      # node:test 脚本契约及 Playwright 元数据采集回归，不启动浏览器、不依赖构建产物。
      - run: npm run test:scripts
      - run: pnpm --filter @einfach/react-excel i18n:extract
      - run: pnpm --filter @einfach/react-excel i18n:check
      - run: npm run build
      # 元数据门禁不下载浏览器；实际运行结果由 Playwright 报告另验，不能混称通过。
      - run: pnpm check:e2e-features
      - run: npm test
      - uses: actions/setup-node@v4
        if: matrix.node-version == '22.19.0'
        with:
          node-version: '22.12.0'
      - name: Consumer Node baseline (ADR 0018, built ESM and CJS)
        if: matrix.node-version == '22.19.0'
        run: |
          node --input-type=module -e "await import('./excel/spreadsheet-ui-core/esm/index.mjs'); await import('./excel/excel-core-ts/esm/index.mjs')"
          node -e "require('./excel/spreadsheet-ui-core/cjs/index.cjs'); require('./excel/excel-core-ts/cjs/index.cjs')"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @einfach/excel-wasm build:wasm:both
      - run: pnpm build:publish
      - run: pnpm --filter @einfach/react-excel exec playwright install --with-deps chromium
      # e2e 先准备真实 pnpm tarball 和仓外 strict-peer 消费者，再用同一配置执行全部主用例。
      - name: Full React and packed consumer browser acceptance
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.codex-artifacts/react-excel-package-004/playwright.json
        run: pnpm --filter @einfach/react-excel e2e --reporter=list,json
      - name: Verify every registered primary result
        run: pnpm check:e2e-features --results .codex-artifacts/react-excel-package-004/playwright.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-package-browser
          path: |
            .codex-artifacts/react-excel-package-004/
            excel/react-excel/test-results/

  # Rust 引擎门禁。三个 crate 的 2700+ 个 #[test] 此前不在任何 workflow 里,
  # 纯靠人工本地跑。命令口径来自 excel/rust/docs/archive/RELEASE_GATE_PLAN.md
  # 的 blocking gate 与 docs/PARITY_BACKLOG_HANDOFF_2026-08-04.md 的验证纪律:
  # excel-core 双跑 default 与 --no-default-features(对应 full/lite 两份 WASM
  # 产物的 feature 面);bench --no-run 抓 bench harness 与引擎 API 签名漂移;
  # wasm-pack test 是 WASM 浏览器行为的门禁(#[wasm_bindgen_test])。
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI 只校验行为，不需要为每个默认/lite/wasm 测试二进制保留 DWARF。
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 三个 crate 没有 workspace 根,target 目录各自独立。
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('excel/rust/**/Cargo.lock', 'excel/rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: cargo test (einfach-core)
        run: cargo test --locked --manifest-path excel/rust/core/Cargo.toml

      - name: cargo test (einfach-excel-core, default features)
        run: cargo test --locked --manifest-path excel/rust/excel-core/Cargo.toml

      - name: cargo test (einfach-excel-core, lite --no-default-features)
        run: cargo test --locked --manifest-path excel/rust/excel-core/Cargo.toml --no-default-features

      - name: cargo bench --no-run (bench harness compile gate)
        run: cargo bench --locked --manifest-path excel/rust/excel-core/Cargo.toml --no-run

      - name: cargo test (einfach-wasm, native)
        run: cargo test --locked --manifest-path excel/rust/wasm/Cargo.toml

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      # runner 镜像自带配套的 Chrome + chromedriver(CHROMEWEBDRIVER 指向其目录)。
      # 必须用 --chromedriver 参数喂给 wasm-pack —— 它不读 CHROMEDRIVER 环境变量,
      # 找不到时会自行下载一份,版本可能与镜像里的 Chrome 不配
      # (本地实测 152 driver 驱动 151 Chrome 时以 `http status: 404` 挂掉)。
      - name: wasm-pack test (einfach-wasm, headless Chrome)
        run: |
          if [ -n "$CHROMEWEBDRIVER" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" excel/rust/wasm
          else
            wasm-pack test --headless --chrome excel/rust/wasm
          fi
