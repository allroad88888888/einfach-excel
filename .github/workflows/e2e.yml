name: e2e

# Solid Excel browser tests. Separate from `ci.yml` (jest + build) so
# e2e flake doesn't block the unit-test signal while the suite settles in.
#
# Gate policy (advisory — this workflow does NOT block PR merge yet):
#   - Advisory for the first 2 weeks of green runs.
#   - Failures upload `playwright-report/` + `test-results/` for triage.
#   - Promote to PR-blocking once stable.
#
# 套件结构（按功能点分目录）见 `excel/solid-excel/e2e/README.md`。
#
# Local equivalent:
#   NO_PROXY=localhost,127.0.0.1 npm run e2e -w @einfach/solid-excel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when new pushes land on the same PR — no point
# burning compute on stale commits.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    # 分片执行。playwright.config 是 workers: 1 + fullyParallel: false
    # (共享一个 dev server、用例间有状态耦合),不能靠提并发压缩,只能横向切。
    # 定分片数那次实测:全量串行 30 分 41 秒,切 4 片后每片约 8 分钟,
    # 20 分钟的上限留足了余量(含 retries: 1 的重试开销)。用例数一直在涨,
    # 这里不记数字 —— 要当前规模用 `npx playwright test --list`。
    #
    # 每片是独立 job:各自起自己的 dev server,分片之间不共享状态,
    # 因此 workers: 1 提供的隔离保证不受影响。
    timeout-minutes: 20

    strategy:
      # 一片失败不影响其他片跑完 —— 要的是完整的失败清单,不是最快熔断。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            excel/rust/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('excel/rust/**/Cargo.lock', 'excel/rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      - run: pnpm install --frozen-lockfile

      - name: Build WASM bundle
        run: npm run build:wasm -w @einfach/solid-excel

      # 必须经 workspace 调用:@playwright/test 是 excel/solid-excel 的
      # devDependency,不在根上。pnpm 不做提升,根目录的 npx 找不到它
      # (sh: 1: playwright: not found,exit 127)。
      - name: Install Playwright browsers
        run: npm run e2e:install -w @einfach/solid-excel

      - name: Run e2e (shard ${{ matrix.shard }}/4)
        run: npm run e2e -w @einfach/solid-excel -- --shard=${{ matrix.shard }}/4
        # Advisory mode for the first 2 weeks. Flip `continue-on-error` to
        # false (or just delete the line) once the suite is stable to make
        # this a PR-blocking gate.
        continue-on-error: true

      # 产物名必须带分片号:同名 artifact 在并行 job 之间会互相冲突。
      - name: Upload Playwright report on failure
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            excel/solid-excel/playwright-report/
            excel/solid-excel/test-results/
          retention-days: 14
          if-no-files-found: ignore
