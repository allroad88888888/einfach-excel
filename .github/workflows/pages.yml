name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            excel/rust/wasm/target
          key: ${{ runner.os }}-cargo-pages-${{ hashFiles('excel/rust/**/Cargo.lock', 'excel/rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pages-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      - run: pnpm install --frozen-lockfile

      - name: Build WASM bundle
        run: npm run build:wasm -w @einfach/excel-wasm

      - name: Build site
        run: pnpm --filter @einfach/excel-site build

      # 部署门禁:对刚构建的 dist(astro preview,与线上同形态)跑冒烟 e2e ——
      # 每个 demo 页预算内出真格子(excel/excel-site/e2e/site-smoke/CASES.md)。
      # 挡的是"island 水合失败 / 资产路径断裂 / seed 卡死"这类部署后才可见的
      # 观感故障;冒烟不过则不部署,线上保留上一个好版本。
      - name: Install Playwright browsers
        run: pnpm --filter @einfach/excel-site e2e:install

      - name: Smoke-test the built site
        run: pnpm --filter @einfach/excel-site e2e
        env:
          EINFACH_SITE_E2E_SKIP_BUILD: '1'

      - name: Upload smoke report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-smoke-report
          path: |
            excel/excel-site/playwright-report/
            excel/excel-site/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: excel/excel-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
