name: Publish

# 暂时只允许手动触发。
#
# NPM_TOKEN 尚未配入仓库 secret（ADR 0016：只走 CI 发布，凭据由维护者填入
# secret）。配好 token 并确认首发后，把 push 触发放回来：
#   on:
#     push:
#       branches: [main]
#
# 首发顺序硬约束（ADR 0017）：首发必须以 0.1.0 出场。仓内若有在途 changeset
# （会把 fixed 组推过 0.1.0），要么先发布再 version，要么由维护者另行裁决 ——
# 不要在首发前跑 `changeset version`。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          changesets = 常规流（有在途 changeset 时只开 Version PR，不发布）；
          first-publish = 按当前版本直接发布（ADR 0017 的首发路径，绕过
          changesets/action，因为它在树里有 changeset 时不会执行 publish）
        type: choice
        options:
          - changesets
          - first-publish
        default: changesets

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # ADR 0018 的对外基线下界。发布环境钉在下界上，发出的产物才顺带证明
          # 基线可用；不要悄悄抬到更高的 Node。
          node-version: 22.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version
      - run: pnpm install --frozen-lockfile
      # build 链含 ensureWasm（lite）；full 变体不是 build 的一部分，发布前显式构建。
      - run: npm run build:wasm:full -w @einfach/excel-wasm
      # build:publish 只构建三个发包项目的声明 + rollup 产物，不含根项目的全仓
      # 测试型检查 —— 那是 ci.yml 的门禁职责，不是发布物的组成部分。
      - run: npm run build:publish
      - name: Create Release PR or Publish
        if: ${{ inputs.mode != 'first-publish' }}
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          # 必须走 pnpm 的发布路径：只有 pnpm 会在打包时把 workspace:* 重写成
          # 真实版本号（实测 npm pack 原样保留，产物不可安装 —— 见
          # docs/AD137_LOCAL_REGISTRY_DRYRUN_OBSERVATION.md）。
          publish: pnpm run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: First publish at current versions
        if: ${{ inputs.mode == 'first-publish' }}
        # 按当前 package.json 版本（首发 = 0.1.0，ADR 0017）直接发布，不跑
        # changeset version。tags 推送失败不回滚发布，手动补推即可。
        run: |
          pnpm run release:publish
          git push --tags || echo "::warning::tags 推送失败，请手动 git push --tags"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
