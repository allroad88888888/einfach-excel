name: Publish

# 暂时只允许手动触发。
#
# 本仓刚从 einfach 拆出,尚未配置 NPM_TOKEN,而 @einfach/spreadsheet-ui-core
# 与 @einfach/solid-excel 在 npm 上都还不存在(404)。仓内也没有待处理的
# changeset,所以 `changeset publish` 会直接尝试首发这两个包 —— 在没有
# token 的情况下必然失败,每次 push 都留一条红。
#
# 配好 NPM_TOKEN 并确认要首发之后,把下面的 push 触发放回来:
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
