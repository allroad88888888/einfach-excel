[package]
name = "einfach-core"
version = "0.1.0"
edition = "2021"
description = "Lightweight atom-based state management engine"

[dependencies]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "store_bench"
harness = false

# 本地 dev/test 只保留行号调试信息：测试二进制体积大幅缩小，回溯仍带文件行号。
