[package]
name = "einfach-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for einfach Excel engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
einfach-core = { path = "../core" }
# `default-features = false` drops `regex-formulas`, so a plain
# `wasm-pack build` (no cargo args) emits the LITE artifact. See
# `[features]` below and `README.md` § "两份产物".
einfach-excel-core = { path = "../excel-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Routes Rust panic messages to console.error in wasm — without this a panic
# is an opaque trap and the whole wasm instance dies silently (C.10).
console_error_panic_hook = "0.1"

# excel-core pulls `rand`, which transitively pulls `getrandom`. On
# `wasm32-unknown-unknown` getrandom refuses to compile unless a
# downstream crate opts into the `js` feature (it then routes entropy
# through `crypto.getRandomValues`). Surface that here so
# `npm run build:wasm` does not blow up. No-op for non-wasm builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# `console::warn_1` for the Wave 8 custom-formula error-message bridge.
# Only used on wasm; native build path drops the log via cfg.
web-sys = { version = "0.3", features = ["console"] }

[features]
# Deliberately NOT in a `default` list — the opposite polarity from
# `einfach-excel-core`, where `regex-formulas` IS default-on so no Rust
# consumer silently loses builtins. Here the default is what ships to the
# browser, and REGEX* costs ~330 KB of Unicode property tables in the
# `data` section, so the browser default is lite and full is opt-in:
#
#   wasm-pack build --target web ...                             # lite
#   wasm-pack build --target web ... -- --features regex-formulas  # full
#
# The wasm crate's own `cargo test` needs no gating — nothing under
# `src/lib.rs` or `tests/web.rs` references REGEXTEST / REGEXEXTRACT /
# REGEXREPLACE, so the 68 native tests pass identically either way.
regex-formulas = ["einfach-excel-core/regex-formulas"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Wire-contract tests only (never in the shipped bundle): the persistence-v1
# envelope is a PERSISTED format, so its backward compatibility — a payload
# written before the `tables` field existed must still deserialize — has to be
# asserted at the JSON-text level, not just against the Rust struct.
serde_json = "1"
# Needed by `tests/web.rs` to await JS Promises (microtask drain) inside
# `#[wasm_bindgen_test]` async fns. wasm-bindgen pulls a private copy via
# its `futures` feature, but `JsFuture` lives in the public crate.
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true

# wasm-pack metadata: skip the wasm-opt post-processing step. wasm-opt
# requires a binaryen binary that wasm-pack tries to download from GitHub
# at build time, which fails in restricted networks.
#
# Turning it off is NOT free, and the size cost is not where you would guess:
# `wasm-opt -O` is also what drops the `name` custom section, i.e. the 558 KB
# function-symbol table (18% of the artifact). `opt-level = "s"` + `lto` do
# nothing about that section. So the strip is done explicitly instead, by
# `scripts/strip-wasm-names.mjs` in solid-excel's `build:wasm` — zero deps, no
# network. Use `build:wasm:keep-names` when you need demangled panic stacks.
#
# What stays on the table by not running wasm-opt: another ~240 KB of raw code
# size (2.60 MB -> 2.36 MB with `-Oz`). Note that win is raw-only — measured
# gzip goes the wrong way (833 KB -> 864 KB), so re-enabling wasm-opt buys
# parse time and memory, not bandwidth.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
