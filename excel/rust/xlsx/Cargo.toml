[package]
name = "einfach-xlsx"
version = "0.1.0"
edition = "2021"
description = "XLSX <-> einfach native workbook file conversion"

[lib]
crate-type = ["cdylib", "rlib"]

# 只认原生 `.einfach.json` 文件格式，不依赖引擎内部：打开/导出仍由 excel-wasm 的
# restore/snapshot 校验，本 crate 只做格式转换，因此可以单独打包、按需加载。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.dev]
debug = "line-tables-only"
